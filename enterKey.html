<!DOCTYPE html>
<html>
<head>
    <title>Enter Key Example</title>
</head>
<body>

    <h2>Simple Form</h2>

    <input type="text" id="name" placeholder="Enter your name">

    <p id="message"></p>


    <script>

        document.addEventListener('keydown', function(event) {
            if (event.keyCode === 13) {
               console.log('You pressed the Enter key!');
            document.getElementById('message').textContent = 'You pressed the Enter key!';
            }
        });
      
    </script>


</body>
</html>
