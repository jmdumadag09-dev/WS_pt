<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header>
            <h1 id="pageTitle">Student Task Manager</h1>
            <p id="subtitle">
                Organize your school requirements
            </p>
        </header>


        <!-- ADD TASK FORM -->
        <section class="task-form-section">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <div class="form-group">

                    <label for="taskInput">
                        Task
                    </label>

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter your task..."
                    >

                </div>


                <div class="form-group">

                    <label for="categorySelect">
                        Category
                    </label>

                    <select id="categorySelect">

                        <option value="Programming">
                            Programming
                        </option>

                        <option value="Database">
                            Database
                        </option>

                        <option value="Networking">
                            Networking
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <button type="submit" id="addButton">
                    Add Task
                </button>

            </form>

            <p id="errorMessage"></p>

        </section>


        <!-- CONTROLS -->
        <section class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search tasks..."
            >


            <select id="filterSelect">

                <option value="all">
                    All Tasks
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>

        </section>


        <!-- TASK INFORMATION -->
        <section class="task-information">

            <div class="stat">
                <span>Total</span>
                <strong id="totalTasks">0</strong>
            </div>

            <div class="stat">
                <span>Pending</span>
                <strong id="pendingTasks">0</strong>
            </div>

            <div class="stat">
                <span>Completed</span>
                <strong id="completedTasks">0</strong>
            </div>

        </section>


        <!-- TASK LIST -->
        <section>

            <h2>Your Tasks</h2>

            <ul id="taskList">
                <!-- JavaScript will add tasks here -->
            </ul>

            <p id="emptyMessage">
                No tasks yet.
            </p>

        </section>


        <!-- KEYBOARD EVENT DEMO -->
        <section class="keyboard-section">

            <h2>Keyboard Event</h2>

            <p>
                Press <strong>Enter</strong> while typing a task
                to quickly add it.
            </p>

            <p id="keyDisplay">
                Last key pressed: None
            </p>

        </section>


        <!-- FOOTER -->
        <footer>

            <button id="clearButton">
                Clear All Tasks
            </button>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
