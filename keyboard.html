<!DOCTYPE html>
<html>
<head>
    <title>Keydown Example</title>
</head>
<body>

    <h2>Press any key on your keyboard</h2>
    <p id="message">Waiting for you to press a key...</p>

    <script>
        document.addEventListener('keydown', function(event) {
            console.log('You pressed a key: ' + event.key);
            console.log('Key code: ' + event.keyCode);
        });
    </script>


</body>
</html>
